[project]
name = "colab-mnist-test"
version = "0.1.0"
description = "A small MNIST project that exercises the Jeeves Colab research workflow end to end."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Needed only on this computer, for the local notebook loop. Colab already has torch and Jupyter installed.
local = ["torch", "torchvision", "ipykernel", "nbclient", "nbformat", "pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
